name: BeautyShelf
options:
  bundleIdPrefix: com.llmzhu
  deploymentTarget:
    iOS: "17.0"
targets:
  BeautyShelf:
    type: application
    platform: iOS
    sources: [BeautyShelf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llmzhu.BeautyShelf
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: 妆台
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
