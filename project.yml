name: BeautyShelf
options:
  bundleIdPrefix: com.llmzhu
  deploymentTarget:
    iOS: "17.0"
targets:
  BeautyShelf:
    type: application
    platform: iOS
    sources: [BeautyShelf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llmzhu.BeautyShelf
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: 妆台
        INFOPLIST_KEY_NSCameraUsageDescription: "拍一张产品照片，贴在妆台上的容器上当标签。"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "从相册选一张产品照片，贴在妆台上的容器上当标签。"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
