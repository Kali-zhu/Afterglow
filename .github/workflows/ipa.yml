name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["BeautyShelf/**", "Widgets/**", "project.yml", "Entitlements/**", ".github/workflows/ipa.yml"]
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild -project BeautyShelf.xcodeproj -scheme BeautyShelf -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | grep -E 'error:|warning: unre|BUILD' || true
          test -d build/Build/Products/Release-iphoneos/BeautyShelf.app
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BeautyShelf.app Payload/
          zip -qry BeautyShelf-unsigned.ipa Payload
          ls -lh BeautyShelf-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: BeautyShelf-unsigned-ipa
          path: BeautyShelf-unsigned.ipa
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-latest
          name: 妆台 测试版 IPA（未签名）
          prerelease: true
          files: BeautyShelf-unsigned.ipa
permissions:
  contents: write
