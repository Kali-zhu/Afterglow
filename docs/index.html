<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>妆台 · BeautyShelf</title>
<style>
:root{
  --porcelain:#EEF1F4; --shelf:#D9DEE4; --ink:#1C1C1E; --ink2:rgba(60,60,67,.6);
  --surface:rgba(255,255,255,.72); --glass:rgba(255,255,255,.55); --glass-stroke:rgba(255,255,255,.85);
  --sage:#5E9277; --honey:#C7862B; --rouge:#B8404F; --fill:rgba(118,118,128,.12);
  --spring:cubic-bezier(.34,1.36,.64,1); --ease:cubic-bezier(.22,1,.36,1);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme:dark){
  :root{--porcelain:#000;--shelf:#2C2C2E;--ink:#F2F2F7;--ink2:rgba(235,235,245,.6);
    --surface:rgba(28,28,30,.78);--glass:rgba(255,255,255,.08);--glass-stroke:rgba(255,255,255,.22);
    --sage:#7FB89A;--honey:#E3A54E;--rouge:#E06876;--fill:rgba(118,118,128,.24)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--porcelain);color:var(--ink)}
body{min-height:100dvh;display:flex;justify-content:center}
.app{width:100%;max-width:440px;padding:calc(env(safe-area-inset-top) + 8px) 20px 60px;position:relative}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #0A84FF;outline-offset:2px;border-radius:12px}

/* nav */
.nav{display:flex;justify-content:flex-end;height:44px;align-items:center}
.icon-btn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;font-size:24px;color:#0A84FF}
h1{font-size:34px;font-weight:700;letter-spacing:.01em;margin:2px 0 10px}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;height:36px;padding:0 8px;color:var(--ink2)}
.search input{flex:1;border:0;background:none;font:inherit;font-size:17px;color:var(--ink);outline:none}
.chips{position:relative;z-index:0;display:flex;gap:6px;overflow-x:auto;margin:16px -20px 0;padding:0 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;flex:none;min-height:44px;padding:0 14px;border-radius:22px;font-size:15px;white-space:nowrap;z-index:0}
.chip[aria-pressed=true]{color:var(--porcelain);font-weight:600}
.chip-pill{position:absolute;left:0;top:0;height:44px;border-radius:22px;background:var(--ink);z-index:-1;transition:transform .45s var(--spring),width .45s var(--spring)}

/* shelf */
section h2{font-size:20px;font-weight:600;margin:28px 0 14px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end;padding-bottom:10px}
.plank{height:6px;border-radius:3px;background:var(--shelf);box-shadow:0 3px 4px rgba(0,0,0,.08);margin-bottom:14px}
.item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0;transition:transform .25s var(--spring)}
.item:active{transform:scale(.95)}
.item .name{font-size:13px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .brand{font-size:11px;color:var(--ink2);margin-top:-6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bottle-wrap{position:relative}
.dot{position:absolute;right:-6px;top:-2px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px var(--porcelain)}
svg.bottle{display:block;overflow:visible}
.empty{text-align:center;padding-top:60px;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:17px;margin:14px 0 6px}
.primary{background:var(--ink);color:var(--porcelain);border-radius:999px;min-height:50px;padding:0 28px;font-weight:600;font-size:17px;margin-top:18px;transition:transform .25s var(--spring),opacity .2s}
.primary:active{transform:scale(.96)}
.primary:disabled{opacity:.35}

/* detail */
.detail{position:fixed;inset:0;z-index:10;display:flex;justify-content:center;pointer-events:none}
.detail .backdrop{position:absolute;inset:0;background:var(--surface);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);opacity:0;transition:opacity .35s var(--ease)}
.detail.open{pointer-events:auto}
.detail.open .backdrop{opacity:1}
.sheet{position:relative;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 70px) 28px calc(env(safe-area-inset-bottom) + 24px);min-height:100dvh}
.close{position:absolute;right:20px;top:calc(env(safe-area-inset-top) + 16px);width:44px;height:44px;border-radius:22px;background:var(--fill);font-size:18px;font-weight:600;opacity:0;transition:opacity .25s}
.stage{position:relative;width:150px;height:244px;margin-top:3vh}
.stage .fly{position:absolute;left:0;top:0;transform-origin:0 0}
.drop{position:absolute;left:50%;top:30px;width:12px;height:12px;margin-left:-6px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;opacity:0;pointer-events:none}
.drop.fall{animation:fall .55s cubic-bezier(.55,0,1,.45) forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(270px) scale(.7)}}
.info{text-align:center;opacity:0;transform:translateY(16px);transition:opacity .3s var(--ease),transform .45s var(--ease)}
.detail.revealed .info,.detail.revealed .close{opacity:1;transform:none}
.info h3{font-size:22px;font-weight:700;margin:24px 0 2px}
.info .b{color:var(--ink2);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px;width:100%}
.stat .v{font-family:ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;display:inline-flex;overflow:hidden;height:34px}
.stat .u{font-size:12px;color:var(--ink2);margin-left:2px}
.stat .l{font-size:12px;color:var(--ink2);margin-top:4px}
.digit{display:inline-block;animation:roll .45s var(--spring)}
@keyframes roll{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}
.spacer{flex:1}
.use{width:100%;opacity:0;transform:translateY(16px);transition:opacity .3s .05s,transform .45s .05s var(--ease)}
.detail.revealed .use{opacity:1;transform:none}
.del{margin-top:6px;color:var(--rouge);font-size:15px;min-height:44px;opacity:0;transition:opacity .3s}
.detail.revealed .del{opacity:1}

/* add sheet */
.add{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.add .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.3);opacity:0;transition:opacity .3s}
.add.open{pointer-events:auto}.add.open .backdrop{opacity:1}
.form{position:relative;width:100%;max-width:440px;max-height:92dvh;overflow:auto;background:var(--porcelain);border-radius:14px 14px 0 0;padding:0 16px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(100%);transition:transform .5s var(--ease)}
.add.open .form{transform:none}
.form header{position:sticky;top:0;background:var(--porcelain);display:flex;justify-content:space-between;align-items:center;height:56px;z-index:1}
.form header b{font-size:17px}
.form header button{color:#0A84FF;font-size:17px;min-height:44px;padding:0 4px}
.form header button:disabled{opacity:.35}
.group-t{font-size:13px;color:var(--ink2);margin:18px 16px 6px}
.group{background:var(--surface);border-radius:10px;overflow:hidden}
@media (prefers-color-scheme:light){.group{background:#fff}}
.field{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 16px;border-bottom:.5px solid rgba(128,128,128,.25);font-size:17px;gap:10px}
.field:last-child{border-bottom:0}
.field input,.field select{border:0;background:none;font:inherit;color:var(--ink);text-align:right;flex:1;min-width:0;outline:none}
.field input::placeholder{color:var(--ink2)}
.stepper{display:flex;background:var(--fill);border-radius:8px}
.stepper button{width:46px;height:32px;font-size:20px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:8px 16px}
.seg button{flex:1;height:30px;border-radius:7px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--porcelain);box-shadow:0 2px 6px rgba(0,0,0,.12);font-weight:600}
.swatches{display:flex;justify-content:space-between;padding:8px 10px}
.sw{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.sw i{width:30px;height:30px;border-radius:50%;transition:transform .3s var(--spring);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}
.sw[aria-pressed=true] i{transform:scale(1.15);box-shadow:0 0 0 2px var(--porcelain),0 0 0 4px var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,40px);opacity:0;background:var(--ink);color:var(--porcelain);padding:10px 18px;border-radius:999px;font-size:15px;transition:all .4s var(--spring);z-index:30;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
.foot{margin-top:40px;text-align:center;font-size:12px;color:var(--ink2)}
.foot a{color:inherit}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app" id="app">
  <div class="nav"><button class="icon-btn" id="addBtn" aria-label="添加产品">＋</button></div>
  <h1>妆台</h1>
  <label class="search"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="搜索名称或品牌" aria-label="搜索名称或品牌"></label>
  <div class="chips" id="chips" role="toolbar" aria-label="分类"><span class="chip-pill" id="pill"></span></div>
  <div id="shelves"></div>
  <p class="foot">网页预览版 · 数据只存在这台设备上 · <a href="https://github.com/LLM-zhu/BeautyShelf">GitHub</a></p>
</main>

<div class="detail" id="detail" aria-hidden="true">
  <div class="backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dName">
    <button class="close" data-close aria-label="关闭">✕</button>
    <div class="stage" id="stage"><span class="drop" id="drop"></span></div>
    <div class="info">
      <h3 id="dName"></h3><div class="b" id="dBrand"></div>
      <div class="stats">
        <div class="stat"><div><span class="v" id="sUses"></span><span class="u">次</span></div><div class="l">已使用</div></div>
        <div class="stat"><div><span class="v" id="sLeft"></span><span class="u" id="sUnit"></span></div><div class="l">剩余</div></div>
        <div class="stat"><div><span class="v" id="sDays"></span><span class="u" id="sDaysU"></span></div><div class="l" id="sDate"></div></div>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="primary use" id="useBtn">用了一次</button>
    <button class="del" id="delBtn">删除这件</button>
  </div>
</div>

<div class="add" id="add" aria-hidden="true">
  <div class="backdrop" data-cancel></div>
  <form class="form" id="form" role="dialog" aria-modal="true" aria-label="添加产品">
    <header><button type="button" data-cancel>取消</button><b>添加产品</b><button type="submit" id="saveBtn" disabled>保存</button></header>
    <div class="group">
      <label class="field"><span>名称</span><input id="fName" placeholder="例如 小棕瓶精华" autocomplete="off"></label>
      <label class="field"><span>品牌</span><input id="fBrand" placeholder="可选" autocomplete="off"></label>
      <label class="field"><span>分类</span><select id="fCat"></select></label>
    </div>
    <div class="group-t">容量</div>
    <div class="group">
      <div class="field"><span>总量 <b id="fTotalV">50</b> <span class="fU">ml</span></span><span class="stepper"><button type="button" data-step="total:-5" aria-label="减少">−</button><button type="button" data-step="total:5" aria-label="增加">＋</button></span></div>
      <div class="seg" id="fUnit" role="group" aria-label="单位"></div>
      <div class="field"><span>每次约 <b id="fPerV">1.0</b> <span class="fU">ml</span></span><span class="stepper"><button type="button" data-step="per:-0.5" aria-label="减少">−</button><button type="button" data-step="per:0.5" aria-label="增加">＋</button></span></div>
    </div>
    <div class="group-t">保质期</div>
    <div class="group"><label class="field"><span>到期日</span><input id="fExp" type="date"></label></div>
    <div class="group-t">液体颜色</div>
    <div class="group"><div class="swatches" id="fSw" role="group" aria-label="液体颜色"></div></div>
  </form>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const LIQUIDS=["#E7B873","#F1E6D8","#BFD7EA","#D5C6E8","#C8E0CC","#F2C4C9","#E9A07A"];
const CATS=["护肤","彩妆","香氛","身体","头发"];
const UNITS=["ml","g","片","支"];
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const $=s=>document.querySelector(s);
const day=864e5, today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const plus=n=>new Date(today().getTime()+n*day).toISOString().slice(0,10);

let items=JSON.parse(localStorage.getItem("bs-items")||"null")||[
  {id:1,name:"小棕瓶精华",brand:"Estée Lauder",cat:"护肤",total:50,left:9,unit:"ml",per:1,uses:41,exp:plus(18),tint:LIQUIDS[0]},
  {id:2,name:"神仙水",brand:"SK-II",cat:"护肤",total:230,left:150,unit:"ml",per:3,uses:27,exp:plus(240),tint:LIQUIDS[2]},
  {id:3,name:"粉底液",brand:"Armani",cat:"彩妆",total:30,left:19,unit:"ml",per:.5,uses:22,exp:plus(-6),tint:LIQUIDS[6]},
  {id:4,name:"面霜",brand:"La Mer",cat:"护肤",total:60,left:44,unit:"g",per:1,uses:16,exp:plus(400),tint:LIQUIDS[1]},
  {id:5,name:"英国梨与小苍兰",brand:"Jo Malone",cat:"香氛",total:100,left:72,unit:"ml",per:.3,uses:90,exp:plus(700),tint:LIQUIDS[3]},
  {id:6,name:"身体乳",brand:"Aesop",cat:"身体",total:500,left:320,unit:"ml",per:6,uses:30,exp:plus(25),tint:LIQUIDS[4]},
  {id:7,name:"唇釉",brand:"Dior",cat:"彩妆",total:6,left:4.5,unit:"ml",per:.05,uses:30,exp:plus(160),tint:LIQUIDS[5]},
  {id:8,name:"护发精油",brand:"Moroccanoil",cat:"头发",total:100,left:63,unit:"ml",per:1,uses:37,exp:plus(300),tint:LIQUIDS[0]},
];
const save=()=>localStorage.setItem("bs-items",JSON.stringify(items));
const days=p=>Math.round((new Date(p.exp+"T00:00:00")-today())/day);
const state=p=>{const d=days(p);return d<0?"expired":d<=30?"soon":"fresh"};
const stateColor=s=>`var(--${s==="expired"?"rouge":s==="soon"?"honey":"sage"})`;
const level=p=>p.total?Math.max(0,Math.min(1,p.left/p.total)):0;
const fmt=n=>Number.isInteger(n)?String(n):n.toFixed(1);

/* ---------- bottle ---------- */
const BW=64,BH=104,CAP=.16,NECK=.05;
function bottleSVG(p,w=BW,h=BH){
  const capH=h*CAP,capW=w*.42,neckH=h*NECK,top=capH+neckH,r=w*.22,bh=h-top;
  const uid="b"+p.id+"_"+w;
  const path=`M${r},${top} H${w-r} Q${w},${top} ${w},${top+r} V${h-r} Q${w},${h} ${w-r},${h} H${r} Q0,${h} 0,${h-r} V${top+r} Q0,${top} ${r},${top}Z`;
  return `<svg class="bottle" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" data-id="${p.id}" data-top="${top}" data-bh="${bh}" aria-label="剩余 ${Math.round(level(p)*100)}%" role="img">
   <defs><clipPath id="${uid}"><path d="${path}"/></clipPath></defs>
   <rect x="${(w-capW)/2}" y="0" width="${capW}" height="${capH}" rx="5" fill="var(--ink)" opacity=".82"/>
   <rect x="${(w-capW*.8)/2}" y="${capH}" width="${capW*.8}" height="${neckH}" fill="var(--glass)" stroke="var(--glass-stroke)" stroke-width=".5"/>
   <path d="${path}" fill="var(--glass)"/>
   <g clip-path="url(#${uid})"><path class="w1" fill="${p.tint}" opacity=".5"/><path class="w2" fill="${p.tint}"/></g>
   <rect x="${w*.14}" y="${top+bh*.15}" width="${Math.max(3,w*.06)}" height="${bh*.5}" rx="${w*.03}" fill="#fff" opacity=".4"/>
   <path d="${path}" fill="none" stroke="var(--glass-stroke)" stroke-width="1"/>
  </svg>`;
}
/* wave engine: each bottle keeps an animated level + slosh energy */
const live=new Map();
function wavePath(w,top,bh,lv,ph,amp){
  const y=top+bh*(1-lv);let d=`M0,${y}`;
  for(let x=0;x<=w;x+=2)d+=` L${x},${(y+Math.sin(x/w*Math.PI*2+ph)*amp).toFixed(2)}`;
  return d+` L${w},${top+bh+2} L0,${top+bh+2}Z`;
}
function tick(t){
  const s=reduce?0:t/1000;
  document.querySelectorAll("svg.bottle").forEach(svg=>{
    const id=+svg.dataset.id,p=items.find(i=>i.id===id)||(id===0?{total:1,left:.15}:null);if(!p)return;
    let L=live.get(id);if(!L){L={lv:level(p),v:0,e:0};live.set(id,L)}
    // spring toward target level
    const k=.08,dmp=.78,target=level(p);L.v=(L.v+(target-L.lv)*k)*dmp;L.lv+=L.v;L.e*=.975;
    const w=+svg.getAttribute("width"),top=+svg.dataset.top,bh=+svg.dataset.bh,sc=w/BW;
    svg.querySelector(".w1").setAttribute("d",wavePath(w,top,bh,L.lv,s*1.4,(2+L.e*6)*sc));
    svg.querySelector(".w2").setAttribute("d",wavePath(w,top,bh,L.lv,s*1.9+1.2,(1.5+L.e*4)*sc));
  });
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- shelf ---------- */
let filter=null,query="";
function renderChips(){
  const c=$("#chips");c.querySelectorAll(".chip").forEach(e=>e.remove());
  [null,...CATS].forEach(cat=>{
    const b=document.createElement("button");b.className="chip";b.textContent=cat||"全部";
    b.setAttribute("aria-pressed",filter===cat);b.onclick=()=>{filter=cat;renderChips();renderShelves();haptic()};
    c.appendChild(b);
  });
  requestAnimationFrame(movePill);
}
function movePill(){
  const on=$("#chips .chip[aria-pressed=true]"),pill=$("#pill");
  pill.style.width=on.offsetWidth+"px";pill.style.transform=`translateX(${on.offsetLeft}px)`;
}
function renderShelves(){
  const shown=items.filter(p=>(!filter||p.cat===filter)&&(!query||(p.name+p.brand).toLowerCase().includes(query)))
    .sort((a,b)=>a.exp.localeCompare(b.exp));
  const urgent=shown.filter(p=>state(p)!=="fresh"),rest=shown.filter(p=>state(p)==="fresh");
  let html="";
  const sec=(t,arr)=>{html+=`<section><h2>${t}</h2>`;for(let i=0;i<arr.length;i+=3){
    html+=`<div class="row">`+arr.slice(i,i+3).map(p=>`<button class="item" data-open="${p.id}" aria-label="${p.name}，${p.brand}，剩余${Math.round(level(p)*100)}%">
      <span class="bottle-wrap">${bottleSVG(p)}${state(p)!=="fresh"?`<span class="dot" style="background:${stateColor(state(p))}"></span>`:""}</span>
      <span class="name">${esc(p.name)}</span><span class="brand">${esc(p.brand)}</span></button>`).join("")+`</div><div class="plank"></div>`}html+=`</section>`};
  if(urgent.length)sec("该先用掉",urgent);
  if(rest.length)sec(urgent.length?"其他":"全部",rest);
  if(!items.length)html=`<div class="empty">${bottleSVG({id:0,tint:LIQUIDS[0],total:1,left:.15})}<b>架子还是空的</b>添加你正在用的第一瓶，记录用量和保质期。<br><button class="primary" onclick="openAdd()">添加产品</button></div>`;
  else if(!shown.length)html=`<div class="empty"><b>没有找到</b>换个关键词或分类试试。</div>`;
  $("#shelves").innerHTML=html;
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openDetail(+b.dataset.open,b));
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
if(!items.find(i=>i.id===0))live.set(0,{lv:.15,v:0,e:0});

/* ---------- detail with FLIP zoom ---------- */
let cur=null,srcBtn=null;
function openDetail(id,btn){
  cur=items.find(i=>i.id===id);srcBtn=btn;
  const d=$("#detail"),stage=$("#stage");
  stage.querySelector(".fly")?.remove();
  const fly=document.createElement("div");fly.className="fly";fly.innerHTML=bottleSVG(cur,150,244);
  stage.prepend(fly);live.set(cur.id,live.get(cur.id)||{lv:level(cur),v:0,e:0});
  $("#drop").style.background=cur.tint;
  fillInfo(false);
  d.classList.add("open");d.setAttribute("aria-hidden","false");
  const from=btn.querySelector("svg").getBoundingClientRect(),to=stage.getBoundingClientRect();
  btn.querySelector(".bottle-wrap").style.visibility="hidden";
  fly.animate([{transform:`translate(${from.left-to.left}px,${from.top-to.top}px) scale(${from.width/150})`},{transform:"none"}],
    {duration:reduce?1:520,easing:"cubic-bezier(.34,1.2,.64,1)"});
  setTimeout(()=>d.classList.add("revealed"),120);
  setTimeout(()=>$("#useBtn").focus({preventScroll:true}),400);
}
function closeDetail(){
  const d=$("#detail"),stage=$("#stage"),fly=stage.querySelector(".fly");
  d.classList.remove("revealed");
  const target=srcBtn&&document.contains(srcBtn)?srcBtn.querySelector("svg"):null;
  const done=()=>{d.classList.remove("open");d.setAttribute("aria-hidden","true");renderShelves();cur=null};
  if(target&&fly){
    const to=target.getBoundingClientRect(),from=stage.getBoundingClientRect();
    const a=fly.animate([{transform:"none"},{transform:`translate(${to.left-from.left}px,${to.top-from.top}px) scale(${to.width/150})`}],
      {duration:reduce?1:420,easing:"cubic-bezier(.22,1,.36,1)",fill:"forwards"});
    d.querySelector(".backdrop").style.opacity=0;
    a.onfinish=()=>{d.querySelector(".backdrop").style.opacity="";done()};
  }else done();
}
function setNum(el,str,animate){
  if(el.dataset.v===str)return;el.dataset.v=str;
  el.innerHTML=[...str].map(c=>`<span class="${animate?"digit":""}">${c}</span>`).join("");
}
function fillInfo(animate){
  const p=cur,dd=days(p);
  $("#dName").textContent=p.name;$("#dBrand").textContent=p.brand;
  setNum($("#sUses"),String(p.uses),animate);setNum($("#sLeft"),fmt(p.left),animate);$("#sUnit").textContent=p.unit;
  setNum($("#sDays"),String(Math.abs(dd)),false);$("#sDaysU").textContent=dd>=0?"天后过期":"天前过期";
  $("#sDays").style.color=state(p)==="fresh"?"":stateColor(state(p));
  $("#sDate").textContent=new Date(p.exp+"T00:00:00").toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric"});
  const b=$("#useBtn");b.disabled=p.left<=0;b.textContent=p.left>0?"用了一次":"已经用完";
}
$("#useBtn").onclick=()=>{
  if(!cur||cur.left<=0)return;
  cur.uses++;cur.left=Math.max(0,+(cur.left-cur.per).toFixed(2));save();
  const L=live.get(cur.id);if(L&&!reduce)L.e=1;
  const drop=$("#drop");drop.classList.remove("fall");void drop.offsetWidth;drop.classList.add("fall");
  fillInfo(true);haptic(12);
  if(cur.left<=0)toast("这瓶用完啦，记得补货");
};
$("#delBtn").onclick=()=>{if(!cur)return;const n=cur.name;items=items.filter(i=>i!==cur);save();srcBtn=null;closeDetail();toast(`已删除 ${n}`)};
document.querySelectorAll("#detail [data-close]").forEach(e=>e.onclick=closeDetail);

/* ---------- add ---------- */
let f={total:50,per:1,unit:"ml",tint:LIQUIDS[0]};
$("#fCat").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
function renderForm(){
  $("#fTotalV").textContent=f.total;$("#fPerV").textContent=f.per.toFixed(1);
  document.querySelectorAll(".fU").forEach(e=>e.textContent=f.unit);
  $("#fUnit").innerHTML=UNITS.map(u=>`<button type="button" aria-pressed="${u===f.unit}" data-u="${u}">${u}</button>`).join("");
  $("#fSw").innerHTML=LIQUIDS.map(c=>`<button type="button" class="sw" aria-pressed="${c===f.tint}" data-c="${c}" aria-label="颜色 ${c}"><i style="background:${c}"></i></button>`).join("");
  $("#fUnit").querySelectorAll("button").forEach(b=>b.onclick=()=>{f.unit=b.dataset.u;renderForm()});
  $("#fSw").querySelectorAll("button").forEach(b=>b.onclick=()=>{f.tint=b.dataset.c;renderForm();haptic()});
}
document.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{
  const[k,v]=b.dataset.step.split(":");
  if(k==="total")f.total=Math.min(1000,Math.max(1,f.total+ +v));else f.per=Math.min(20,Math.max(.5,f.per+ +v));renderForm()});
function openAdd(){
  f={total:50,per:1,unit:"ml",tint:LIQUIDS[0]};$("#form").reset();$("#fExp").value=plus(365);$("#saveBtn").disabled=true;renderForm();
  $("#add").classList.add("open");$("#add").setAttribute("aria-hidden","false");setTimeout(()=>$("#fName").focus(),350);
}
function closeAdd(){$("#add").classList.remove("open");$("#add").setAttribute("aria-hidden","true")}
$("#addBtn").onclick=openAdd;
document.querySelectorAll("[data-cancel]").forEach(e=>e.onclick=closeAdd);
$("#fName").oninput=e=>$("#saveBtn").disabled=!e.target.value.trim();
$("#form").onsubmit=e=>{
  e.preventDefault();const name=$("#fName").value.trim();if(!name)return;
  const id=Math.max(0,...items.map(i=>i.id))+1;
  items.push({id,name,brand:$("#fBrand").value.trim(),cat:$("#fCat").value,total:f.total,left:f.total,unit:f.unit,per:f.per,uses:0,exp:$("#fExp").value||plus(365),tint:f.tint});
  save();closeAdd();filter=null;renderChips();renderShelves();toast(`已添加 ${name}`);
};

/* ---------- misc ---------- */
$("#q").oninput=e=>{query=e.target.value.trim().toLowerCase();renderShelves()};
function haptic(ms=6){navigator.vibrate?.(ms)}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2000)}
addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#add").classList.contains("open"))closeAdd();else if(cur)closeDetail()}});
addEventListener("resize",movePill);
renderChips();renderShelves();
</script>
</body>
</html>
